<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recreation of a spinning record with a wheel of note lines, matched to the reference video">
  <title>Vinyl</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <!-- Coordinates are reference video pixels (1920x1198). The record and note lines hug the left edge and fit the window height;
       title, transport and time stick to the window edges (main.js). -->
  <div id="stage">
    <div id="scene">
      <div class="glow" aria-hidden="true"></div>
      <canvas id="disc" aria-label="Spinning record"></canvas>
      <svg id="deck" viewBox="0 0 1920 1198" aria-hidden="true"></svg>
      <div id="wheel" aria-label="Note lines"></div>
    </div>
    <header class="title">
      <p class="song">Soft Static</p>
      <p class="artist"><svg class="mark" viewBox="-10 -10 20 20" aria-hidden="true"><circle r="6.4" /><circle class="dot" r="2.4" /></svg>ysh4267</p>
    </header>
    <nav class="transport" aria-label="Playback">
      <button id="prev" type="button" aria-label="Previous line"><svg viewBox="0 0 24 24"><path d="M7 6.5v11" /><path d="M17.5 6.6v10.8L9.6 12z" class="fill" /></svg></button>
      <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24"><path class="fill icon-play" d="M9 6.8v10.4L17.2 12z" /><g class="icon-pause"><path d="M9.6 7.2v9.6" /><path d="M14.4 7.2v9.6" /></g></svg></button>
      <button id="next" type="button" aria-label="Next line"><svg viewBox="0 0 24 24"><path d="M17 6.5v11" /><path d="M6.5 6.6v10.8L14.4 12z" class="fill" /></svg></button>
    </nav>
    <div class="extras" aria-label="Sound">
      <button id="loop" type="button" aria-label="Loop" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m17 2.5 3.5 3.5L17 9.5" /><path d="M3.5 11.5V10a4 4 0 0 1 4-4h13" /><path d="M7 21.5 3.5 18 7 14.5" /><path d="M20.5 12.5V14a4 4 0 0 1-4 4h-13" /></svg></button>
      <button id="mute" type="button" aria-label="Mute"><svg viewBox="0 0 24 24"><path class="fill" d="M11 5 6.2 9H3v6h3.2l4.8 4z" /><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7" /><path class="wave" d="M18.5 5.5a9.2 9.2 0 0 1 0 13" /><path class="cross" d="m16 9.5 5 5m0-5-5 5" /></svg></button>
      <input id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
    </div>
    <p class="time"><span id="now">0:00</span><span class="total"> / 0:17</span></p>
  </div>
</body>
</html>
